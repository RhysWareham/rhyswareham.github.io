<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game over · Rhys Wareham</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@700&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    .over { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px 16px; }
    .over h1 { font: 800 clamp(56px, 12vw, 128px)/.9 var(--font-display); letter-spacing: -.04em; margin: 18px 0 16px; }
    .over p { color: var(--ink-2); font-size: 19px; margin-bottom: 30px; }
    .over .cta { justify-content: center; }
    .blink { animation: blink 1.1s steps(2, jump-none) infinite; }
  </style>
</head>
<body>
  <main class="over">
    <div>
      <p class="eyebrow">Error 404</p>
      <h1>Game over</h1>
      <p>That page fell off the edge of the map.</p>
      <div class="cta"><a class="btn btn--primary" href="/">Continue? <span class="blink">▶</span></a></div>
    </div>
  </main>
</body>
</html>
